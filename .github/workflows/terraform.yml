name: Terraform Azure CI

on:

  push:
    branches:
      - terraform-cicd
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  terraform-ci:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "40148f2c-788d-4498-8cca-34b134ef4ee8"
          tenant-id: "a859ae35-14ed-4da2-88b7-e9b8165a67fa"
          subscription-id: "e82eae71-c563-484d-912c-a20b08bd744c" 

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan